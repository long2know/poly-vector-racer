name: poly-vector-racer

services:
  web:
    image: ${POLY_VECTOR_RACER_IMAGE:-ghcr.io/long2know/poly-vector-racer:latest}
    init: true
    environment:
      BASE_URL: ${BASE_URL-/poly-vector-racer}
    ports:
      - "127.0.0.1:${STUNT_PORT:-5188}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
