# Include inside the existing TLS server for games.long2know.com.
# Match the loopback port published by compose.yaml (STUNT_PORT).
location = /poly-vector-racer {
    return 308 /poly-vector-racer/$is_args$args;
}

location ^~ /poly-vector-racer/ {
    # No trailing slash: ASP.NET expects the full BASE_URL prefix.
    proxy_pass http://127.0.0.1:5188;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
