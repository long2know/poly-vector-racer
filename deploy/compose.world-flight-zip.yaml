services:
  poly-vector-racer:
    environment:
      STUNT_WORLD_FLIGHT: /app/data/world-flight.zip
    volumes:
      - type: bind
        source: ${WORLD_FLIGHT_ZIP:?Set WORLD_FLIGHT_ZIP to the absolute archive path}
        target: /app/data/world-flight.zip
        read_only: true
        bind:
          create_host_path: false
