services:
  poly-vector-racer:
    environment:
      STUNT_WORLD_FLIGHT: /app/data/world-flight/manifest.json
    volumes:
      - type: bind
        source: ${WORLD_FLIGHT_DIR:-${DOCKER_DATA:?Set DOCKER_DATA or WORLD_FLIGHT_DIR}/games/poly-vector-racer/world-flight}
        target: /app/data/world-flight
        bind:
          create_host_path: false
